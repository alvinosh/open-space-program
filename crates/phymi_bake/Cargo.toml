[package]
name = "phymi_bake"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Downloads public Earth datasets and bakes them into Phymi terrain tiles."

[dependencies]
phymi_terrain = { workspace = true }
glam = { version = "0.33" }
serde_json = { workspace = true }
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1"
flate2 = "1"
weezl = "0.1"

[lints]
workspace = true
