[package]
name = "osp_game"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osp"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
osp_sim = { workspace = true }
osp_mods = { workspace = true }
osp_ui = { workspace = true }
osp_terrain = { workspace = true }
half = "2"
ab_glyph = "0.2"
resvg = { version = "0.47", default-features = false }

[features]
# Faster incremental builds during development: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]
# Time every system and schedule for the profiler (F10, `OSP_PROFILE`); costs a little.
profile = ["bevy/trace", "bevy/debug"]

[lints]
workspace = true
